name: ShaderExtensions CI

permissions:
  contents: write

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-package:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.build.outputs.version }}
      ksa_version: ${{ steps.build.outputs.ksa_version }}
      artifact_name: ${{ steps.build.outputs.artifact_name }}
      release_needed: ${{ steps.build.outputs.release_needed }}
    env:
      KSA_DLL_REPO: ${{ secrets.KSADLLRepo }}
      KSA_DLL_APP_ID: ${{ secrets.APP_ID }}
      KSA_DLL_APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Build and package ShaderExtensions
        id: build
        uses: ./tooling/ci/build-package
        with:
          csproj_path: ShaderExtensions/ShaderExtensions.csproj
          mod_deps: |
            [
              {"repo": "KittenExtensions", "dll": "KittenExtensions.dll", "mod_name": "KittenExtensionsContinued"}
            ]

  release:
    runs-on: ubuntu-latest
    needs: build-package
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build-package.outputs.release_needed == 'true' }}
    env:
      SPACEDOCK_ID: '4164'
      SPACEDOCK_USERNAME: ${{ vars.SPACEDOCKUSERNAME }}
      SPACEDOCK_AUTH: ${{ secrets.SPACEDOCKAUTH }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Publish GitHub and SpaceDock release
        uses: ./tooling/ci/release
        with:
          version: ${{ needs.build-package.outputs.version }}
          ksa_version: ${{ needs.build-package.outputs.ksa_version }}
          artifact_name: ${{ needs.build-package.outputs.artifact_name }}
